# This file is for default values of the fau-monitor Helm chart.
# This is where you define the default values for your templates.

replicaCount: 1

image:
  repository: ghcr.io/Sepiidae/fau-monitor
  pullPolicy: IfNotPresent
  # Overrides the image tag, defaults to "latest"
  tag: "latest"

service:
  type: ClusterIP
  port: 5001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources: {}

nodeSelector: {}

tolerations: []

podAntiAffinity: {}

podAffinity: {}
