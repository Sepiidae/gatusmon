<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAU Status Monitor</title>
  <style>
    :root {
      --fau-blue: #003366;
      --fau-red: #CC0000;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      
      --status-ok: #10b981;
      --status-warning: #f59e0b;
      --status-critical: #ef4444;
      --status-unknown: #3b82f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--fau-blue);
      border-bottom: 2px solid var(--fau-red);
      padding: 0.25rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .timestamp {
      font-size: 0.65rem;
      opacity: 0.8;
    }

    main {
      padding: 0.35rem;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden; /* Multi-column wraps horizontally to avoid vertical scroll */
    }

    /* Multi-Column Layout: Flow top-to-bottom, then left-to-right */
    .vertical-groups-wrapper {
      column-width: 280px;
      column-gap: 0.35rem;
      height: 100%;
    }

    .group-container {
      break-inside: avoid; /* Keeps group sections intact */
      display: inline-block;
      width: 100%;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 0.3rem 0.4rem;
      margin-bottom: 0.35rem;
    }

    .group-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin: 0 0 0.2rem 0;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .group-count {
      font-size: 0.6rem;
      color: #64748b;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
    }

    /* Ultra-Compact Micro Status Boxes (40x40px) */
    .square {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.15rem;
      transition: transform 0.1s ease, filter 0.1s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .square:hover {
      transform: scale(1.15);
      filter: brightness(1.25);
      z-index: 10;
    }

    .status-ok { background-color: var(--status-ok); color: #ffffff; }
    .status-warning { background-color: var(--status-warning); color: #000000; }
    .status-critical { background-color: var(--status-critical); color: #ffffff; }
    .status-unknown { background-color: var(--status-unknown); color: #ffffff; }

    .square .title {
      font-weight: 700;
      font-size: 0.5rem;
      line-height: 1;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border-top: 4px solid var(--fau-blue);
      border-radius: 8px;
      width: 90%;
      max-width: 440px;
      padding: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.7rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .contact-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--fau-red);
      padding: 0.5rem;
      margin-top: 0.6rem;
      border-radius: 0 4px 4px 0;
    }

    ul { padding-left: 1rem; margin: 0.3rem 0; font-size: 0.75rem; }
    li { margin-bottom: 0.15rem; }
  </style>
</head>
<body>

  <header>
    <h1>FAU OIT Service Monitor</h1>
    <div class="timestamp" id="last-updated">Updating...</div>
  </header>

  <main>
    <div class="vertical-groups-wrapper" id="dashboard-content"></div>
  </main>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-badge" class="badge"></div>
      <h3 id="modal-title" style="margin: 0 0 0.2rem 0; font-size: 1rem;"></h3>
      <p id="modal-group" style="color: #94a3b8; font-size: 0.75rem; margin: 0 0 0.6rem 0;"></p>
      
      <h4 style="margin: 0.4rem 0; font-size: 0.85rem;">Status Diagnostics</h4>
      <div id="modal-diagnostics"></div>

      <div id="modal-contact" class="contact-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    let globalGroups = {};

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        globalGroups = data.groups || {};
        document.getElementById('last-updated').innerText = `Updated: ${data.last_updated || 'Pending...'}`;
        renderDashboard(globalGroups);
      } catch (err) {
        console.error("Failed fetching status data", err);
      }
    }

    function renderDashboard(groups) {
      const container = document.getElementById('dashboard-content');
      container.innerHTML = '';

      Object.keys(groups).sort().forEach(groupName => {
        const groupContainer = document.createElement('div');
        groupContainer.className = 'group-container';

        const groupTitle = document.createElement('div');
        groupTitle.className = 'group-title';
        groupTitle.innerHTML = `
          <span>${groupName}</span>
          <span class="group-count">${groups[groupName].length}</span>
        `;
        groupContainer.appendChild(groupTitle);

        const grid = document.createElement('div');
        grid.className = 'grid';

        groups[groupName].forEach((svc, index) => {
          const sq = document.createElement('div');
          sq.className = `square status-${svc.status}`;
          sq.title = `${svc.name} (${svc.status.toUpperCase()})`;
          sq.onclick = () => openModal(groupName, index);

          sq.innerHTML = `<div class="title">${svc.name}</div>`;
          grid.appendChild(sq);
        });

        groupContainer.appendChild(grid);
        container.appendChild(groupContainer);
      });
    }

    function openModal(groupName, index) {
      const svc = globalGroups[groupName][index];
      const details = svc.details || {};
      
      document.getElementById('modal-title').innerText = svc.name;
      document.getElementById('modal-group').innerText = `Group: ${svc.group}`;
      
      const badge = document.getElementById('modal-badge');
      badge.innerText = svc.status;
      badge.className = `badge status-${svc.status}`;

      let condHtml = `<p style="font-size: 0.75rem; margin: 0.15rem 0;"><strong>Host:</strong> ${details.hostname || 'N/A'}</p>`;
      condHtml += `<p style="font-size: 0.75rem; margin: 0.15rem 0;"><strong>Latency:</strong> ${details.duration ? (details.duration / 1000000).toFixed(2) + ' ms' : 'N/A'}</p>`;
      condHtml += '<h5 style="margin: 0.4rem 0 0.15rem 0; font-size: 0.8rem;">Conditions:</h5><ul>';
      
      (details.conditionResults || []).forEach(c => {
        const icon = c.success ? '✅' : '❌';
        condHtml += `<li>${icon} <code>${c.condition}</code></li>`;
      });
      condHtml += '</ul>';
      
      document.getElementById('modal-diagnostics').innerHTML = condHtml;

      const contactContainer = document.getElementById('modal-contact');
      if (svc.contact) {
        contactContainer.style.display = 'block';
        contactContainer.innerHTML = `
          <strong style="color: #f8fafc; font-size: 0.8rem;">Assigned Contact</strong>
          <p style="margin: 0.2rem 0 0 0; font-size: 0.75rem;">
            <strong>Name:</strong> ${svc.contact.name || 'N/A'}<br>
            ${svc.contact.phones && svc.contact.phones.length > 0 ? svc.contact.phones.map(p => `<strong>Phone:</strong> <a href="tel:${p}" style="color: #60a5fa;">${p}</a>`).join('<br>') : ''}<br>
            ${svc.contact.emails && svc.contact.emails.length > 0 ? svc.contact.emails.map(e => `<strong>Email:</strong> <a href="mailto:${e}" style="color: #60a5fa;">${e}</a>`).join('<br>') : ''}
          </p>
        `;
      } else {
        contactContainer.style.display = 'none';
      }

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    fetchStatus();
    setInterval(fetchStatus, 10000);
  </script>
</body>
</html>
