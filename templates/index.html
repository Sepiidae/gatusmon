<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAU Status Monitor</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>

  <header>
    <h1>FAU OIT Service Monitor</h1>
    <div class="timestamp" id="last-updated">Updating...</div>
  </header>

  <main>
    <div class="vertical-groups-wrapper" id="dashboard-content"></div>
  </main>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-badge" class="badge"></div>
      <h3 id="modal-title" style="margin: 0 0 0.2rem 0; font-size: 1rem;"></h3>
      <p id="modal-group" style="color: #94a3b8; font-size: 0.75rem; margin: 0 0 0.6rem 0;"></p>
      
      <h4 style="margin: 0.4rem 0; font-size: 0.85rem;">Status Diagnostics</h4>
      <div id="modal-diagnostics"></div>

      <div id="modal-contact" class="contact-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    let globalGroups = {};

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        globalGroups = data.groups || {};
        document.getElementById('last-updated').innerText = `Updated: ${data.last_updated || 'Pending...'}`;
        renderDashboard(globalGroups);
      } catch (err) {
        console.error("Failed fetching status data", err);
      }
    }

    function renderDashboard(groups) {
      const container = document.getElementById('dashboard-content');
      container.innerHTML = '';

      Object.keys(groups).sort().forEach(groupName => {
        const groupContainer = document.createElement('div');
        groupContainer.className = 'group-container';

        const groupTitle = document.createElement('div');
        groupTitle.className = 'group-title';
        groupTitle.innerHTML = `
          <span>${groupName}</span>
          <span class="group-count">${groups[groupName].length}</span>
        `;
        groupContainer.appendChild(groupTitle);

        const grid = document.createElement('div');
        grid.className = 'grid';

        groups[groupName].forEach((svc, index) => {
          const sq = document.createElement('div');
          sq.className = `square status-${svc.status}`;
          sq.title = `${svc.name} (${svc.status.toUpperCase()})`;
          sq.onclick = () => openModal(groupName, index);

          sq.innerHTML = `<div class="title">${svc.name}</div>`;
          grid.appendChild(sq);
        });

        groupContainer.appendChild(grid);
        container.appendChild(groupContainer);
      });
    }

    function openModal(groupName, index) {
      const svc = globalGroups[groupName][index];
      const details = svc.details || {};
      
      document.getElementById('modal-title').innerText = svc.name;
      document.getElementById('modal-group').innerText = `Group: ${svc.group}`;
      
      const badge = document.getElementById('modal-badge');
      badge.innerText = svc.status;
      badge.className = `badge status-${svc.status}`;

      let condHtml = `<p style="font-size: 0.75rem; margin: 0.15rem 0;"><strong>Host:</strong> ${details.hostname || 'N/A'}</p>`;
      condHtml += `<p style="font-size: 0.75rem; margin: 0.15rem 0;"><strong>Latency:</strong> ${details.duration ? (details.duration / 1000000).toFixed(2) + ' ms' : 'N/A'}</p>`;
      condHtml += '<h5 style="margin: 0.4rem 0 0.15rem 0; font-size: 0.8rem;">Conditions:</h5><ul>';
      
      (details.conditionResults || []).forEach(c => {
        const icon = c.success ? '✅' : '❌';
        condHtml += `<li>${icon} <code>${c.condition}</code></li>`;
      });
      condHtml += '</ul>';
      
      document.getElementById('modal-diagnostics').innerHTML = condHtml;

      const contactContainer = document.getElementById('modal-contact');
      if (svc.contact) {
        contactContainer.style.display = 'block';
        contactContainer.innerHTML = `
          <strong style="color: #f8fafc; font-size: 0.8rem;">Assigned Contact</strong>
          <p style="margin: 0.2rem 0 0 0; font-size: 0.75rem;">
            <strong>Name:</strong> ${svc.contact.name || 'N/A'}<br>
            ${svc.contact.phones && svc.contact.phones.length > 0 ? svc.contact.phones.map(p => `<strong>Phone:</strong> <a href="tel:${p}" style="color: #60a5fa;">${p}</a>`).join('<br>') : ''}<br>
            ${svc.contact.emails && svc.contact.emails.length > 0 ? svc.contact.emails.map(e => `<strong>Email:</strong> <a href="mailto:${e}" style="color: #60a5fa;">${e}</a>`).join('<br>') : ''}
          </p>
        `;
      } else {
        contactContainer.style.display = 'none';
      }

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    fetchStatus();
    setInterval(fetchStatus, 10000);
  </script>
</body>
</html>
